name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.13'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with stacktrace
      run: ./gradlew :app:assembleDebug --stacktrace

    - name: Prepare APK for release
      run: |
        mkdir -p release
        cp app/build/outputs/apk/debug/*.apk release/app-debug.apk
        ls -la release/

    - name: Upload APK (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: release/app-debug.apk
        retention-days: 30

    # 推送到 main/master 或手动触发时，发布到 Releases，方便直接下载
    - name: Publish to GitHub Release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Build #${{ github.run_number }}
        body: |
          自动构建 Debug APK
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
        files: release/app-debug.apk
        draft: false
        prerelease: true