name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.13'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 新增：生成 Debug 签名文件
    - name: Generate debug keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore \
          -storepass android -alias androiddebugkey -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug, O=Android, C=US"

    # 构建 Release，使用 Debug 签名
    - name: Build Release APK
      run: |
        ./gradlew :app:assembleRelease \
          -Pandroid.injected.signing.store.file=$(echo $HOME/.android/debug.keystore) \
          -Pandroid.injected.signing.store.password=android \
          -Pandroid.injected.signing.key.alias=androiddebugkey \
          -Pandroid.injected.signing.key.password=android

    - name: Prepare APK for release
      run: |
        mkdir -p release
        cp app/build/outputs/apk/release/*.apk release/app-release.apk
        ls -la release/

    - name: Upload APK (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: release/app-release.apk
        retention-days: 30

    - name: Publish to GitHub Release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Build #${{ github.run_number }}
        body: |
          自动构建 Release APK（使用 Debug 签名，仅个人使用）
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
        files: release/app-release.apk
        draft: false
        prerelease: true